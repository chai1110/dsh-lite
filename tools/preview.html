<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSH Lite UI Preview</title>
<link rel="stylesheet" href="../assets/codicons/codicon.css" />
<link rel="stylesheet" href="../out/webview.css" />
<style>
  /* mock 宿主：近似 VS Code 默认深色主题的 --vscode-* 变量，保证预览与真实一致 */
  html, body { height: 100%; margin: 0; }
  #root { height: 100%; }
  body.vscode-dark {
    --vscode-sideBar-background: #252526; --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d; --vscode-editor-background: #1e1e1e;
    --vscode-panel-border: #3c3c3c; --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc; --vscode-input-border: #3c3c3c;
    --vscode-button-background: #0e639c; --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #1177bb;
    --vscode-button-secondaryBackground: #3a3d41; --vscode-button-secondaryForeground: #ffffff;
    --vscode-button-secondaryHoverBackground: #45494e;
    --vscode-editorWidget-background: #252526; --vscode-widget-border: #454545;
    --vscode-list-hoverBackground: #2a2d2e; --vscode-list-activeSelectionBackground: #094771;
    --vscode-list-activeSelectionForeground: #ffffff; --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #ffffff; --vscode-toolbar-hoverBackground: rgba(90,93,94,.31);
    --vscode-charts-green: #89d185; --vscode-charts-red: #f14c4c; --vscode-charts-yellow: #cca700;
    --vscode-charts-blue: #75beff; --vscode-charts-purple: #b180d7;
    --vscode-errorForeground: #f48771;
    --vscode-inputValidation-warningBackground: #352a05; --vscode-inputValidation-warningBorder: #b89500;
    --vscode-chat-requestBackground: #2f3640; --vscode-chat-requestBorder: #454545;
    background: #1e1e1e; color: #cccccc;
  }
  body.vscode-light {
    --vscode-sideBar-background: #f3f3f3; --vscode-foreground: #1f1f1f;
    --vscode-descriptionForeground: #616161; --vscode-editor-background: #ffffff;
    --vscode-panel-border: #e0e0e0; --vscode-input-background: #ffffff;
    --vscode-input-foreground: #1f1f1f; --vscode-input-border: #d4d4d4;
    --vscode-button-background: #007acc; --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #0062a3;
    --vscode-button-secondaryBackground: #5a5d61; --vscode-button-secondaryForeground: #ffffff;
    --vscode-button-secondaryHoverBackground: #6e7175;
    --vscode-editorWidget-background: #f3f3f3; --vscode-widget-border: #c8c8c8;
    --vscode-list-hoverBackground: #e8e8e8; --vscode-list-activeSelectionBackground: #0060c0;
    --vscode-list-activeSelectionForeground: #ffffff; --vscode-badge-background: #c4c4c4;
    --vscode-badge-foreground: #333333; --vscode-toolbar-hoverBackground: rgba(0,0,0,.1);
    --vscode-charts-green: #388a34; --vscode-charts-red: #a1260d; --vscode-charts-yellow: #b89500;
    --vscode-charts-blue: #007acc; --vscode-charts-purple: #652d90;
    --vscode-errorForeground: #a1260d;
    --vscode-inputValidation-warningBackground: #fff6d5; --vscode-inputValidation-warningBorder: #b89500;
    --vscode-chat-requestBackground: #e9e9e9; --vscode-chat-requestBorder: #d4d4d4;
    background: #f3f3f3; color: #1f1f1f;
  }
</style>
</head>
<body class="vscode-dark">
<div id="root"></div>
<script>
  // —— mock 宿主侧 ——
  window.__ui = [];
  window.DSH_LOGO = '/assets/icon.svg'; // mock 宿主注入的品牌 logo
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { window.__ui.push(m); },
  });
  // 等 webview 挂载并发出 hello 后再下发假状态
  const DAY = 86400000;
  const now = Date.now();
  const session = (id, title, updatedAt, running, cwd, archived) =>
    ({ sessionId: id, title, updatedAt, running, cwd, archived });
  const sessions = [
    session('s1', '优化 dsh-lite 消息流布局的调研与实现', now - 5 * 60000, false, '~/dsh-vscode-lite', undefined),
    session('s2', 'M8 双栏容器与右上角入口', now - 2 * 3600000, true, '~/dsh-vscode-lite', undefined),
    session('s3', '解决 0.1.2-rc.1 unarchive 404', now - 1.2 * DAY, false, '~/dsh-custom-patches', undefined),
    session('s4', '妈妈抖音号养花脚本（昨天中午）', now - 1.05 * DAY, false, '~/抖音副业', undefined),
    session('s5', '30 天减脂第 2 周复盘', now - 3 * DAY, false, '~/减脂', undefined),
    session('s6', '旧的 dsh 历史会话', now - 20 * DAY, false, '~/旧项目', undefined),
    session('s7', '已归档：M1 原型对话', now - 30 * DAY, false, '~/归档', true),
    session('s8', '已归档：踩坑记录', now - 8 * DAY, false, '~/归档', true),
  ];
  const messages = [
    { id: 'm1', role: 'user', text: '把消息流的布局改成左边是角色图标、右边是内容，hover 出复制按钮，像 Codex 那样。' },
    { id: 'm2', role: 'assistant', text: '好的，我来梳理一下改造点：顶栏改成「logo + 历史入口」，消息行加角色图标列，发送按钮改成圆形。\n需要同时保证双栏（左/右）都能用。' },
    { id: 'm3', kind: 'tool', role: 'assistant', toolState: 'call', text: 'rg -n "MsgRow|msg-row" webview/', id: '' },
    { id: 'm4', kind: 'tool', role: 'assistant', toolState: 'result', text: 'webview/app.tsx:83:function MsgRow...\nwebview/styles.css:412:.msg-row{display:flex...}\n（共 12 处命中，其中含长文本的会被 clamp 折叠到 6 行，点展开查看全文。这是一段用于验证长结果折叠展示的补充说明文字，确保超过 300 字符的阈值以便渲染出展开/收起按钮。这段文字可以再长一点也没有关系，主要目的是触发 long 分支。）' },
    { id: 'm5', role: 'assistant', text: '另外我注意到 0.5.1 是通过 iframe 内嵌官方整站，所以它天然就长官方 GUI 那样；我们是自研 webview，需要在符号和布局上主动对齐。' },
    { id: 'm6', kind: 'command', role: 'assistant', cmdState: 'run', text: '/goal 完成 UI 符号化改造', cmdOk: undefined },
    { id: 'm7', kind: 'command', role: 'assistant', cmdState: 'done', cmdOk: true, text: '/goal 完成 UI 符号化改造', resultText: '目标已创建（进行中）' },
    { id: 'm8', role: 'user', text: '运行 npm test 确认没有回归。' },
    { id: 'm9', role: 'assistant', streaming: false, text: 'npm test 结果：86 passed / 0 failed / 3 skipped（E2E 需真机）。' },
  ];
  const state = {
    connection: 'ready',
    error: null,
    sessions,
    activeSessionId: 's1',
    messages,
    composerEnterBehavior: 'send',
    goal: { id: 'g1', revision: 1, objective: '完成 UI 符号化改造', phase: 'active', maxGoalRounds: 5, roundsStarted: 1, createdAt: now - 60000, updatedAt: now - 30000 },
    approval: null,
    commands: [{ name: 'goal', description: '设定/查看目标', hint: 'objective' }, { name: 'clear', description: '清空当前上下文' }],
  };
  window.addEventListener('load', () => {
    setTimeout(() => {
      window.postMessage({ type: 'host/state', state }, '*');
      // 历史视图模式：自动点开会话历史入口
      if (new URLSearchParams(location.search).get('view') === 'history') {
        setTimeout(() => { document.querySelector('.session-btn')?.click(); }, 300);
      }
    }, 200);
  });
</script>
<script src="../out/webview.js"></script>
</body>
</html>
